<!DOCTYPE html>
<html>
<head>
    <title>Simple CRUD in PHP & MySQL</title>
</head>
<body>
    <h2>Insert Student</h2>
    <form action="DML_Commands.php" method="post">
        Name: <input type="text" name="name" required><br><br>
        Email: <input type="email" name="email" required><br><br>
        Age: <input type="number" name="age" required><br><br>
        Course: <input type="text" name="course"><br><br>
        <input type="submit" name="insert" value="Insert">
    </form>

    <h2>Update Student Course</h2>
    <form action="DML_Commands.php" method="post">
        Student ID: <input type="number" name="id" required><br><br>
        New Course: <input type="text" name="course"><br><br>
        <input type="submit" name="update" value="Update">
    </form>

    <h2>Delete Student</h2>
    <form action="DML_Commands.php" method="post">
        Student ID: <input type="number" name="id" required><br><br>
        <input type="submit" name="delete" value="Delete">
    </form>

    <h2>All Students</h2>
    <a href="DML_Commands.php">View Students</a>
</body>
</html>
